name: jenkins

services:
    jenkins:
        build: ./jenkins-image
        image: jenkins-on-server-jenkins:latest
        container_name: jenkins
        restart: unless-stopped
        user: "0:0"
        # Jenkins web -> host loopback ONLY (127.0.0.1:18080 -> container 8080).
        # The container still listens on 8080 internally; it must never be bound
        # on 0.0.0.0. Public access goes through the host reverse proxy (nginx),
        # never through this port directly.
        #
        # Inbound agent port 50000 is intentionally NOT published: this project
        # defines no inbound JNLP agents (no Jenkinsfile/agent config that needs
        # it). If you ever add inbound agents, publish them locally only:
        #     - "127.0.0.1:15000:50000"
        ports:
            - "127.0.0.1:18080:8080"
        # Hard container memory ceiling. Honored by Docker Compose v2 in the
        # default (non-swarm) `docker compose up` flow.
        #
        # 640m, а не 768m: на сервере ВСЕГО 961 МБ физической памяти, и Jenkins был
        # крупнейшим потребителем платформы — 555 МБ (130 МБ в RAM + 425 МБ вытеснено
        # в своп). Для сравнения: все двадцать контейнеров платформы вместе занимают
        # ~240 МБ, то есть один CI съедал больше, чем всё, что он обслуживает.
        # Потолок = heap 320 + metaspace 160 + native/стек ≈ 600 МБ, с запасом.
        mem_limit: 640m
        # Логи контейнера по умолчанию растут без предела, а диск на сервере уже был
        # занят на 93%. Три файла по 10 МБ — потолок в 30 МБ вместо бесконечности.
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        environment:
            # Controller JVM: heap caps + setup wizard. Use the Jenkins-specific
            # JENKINS_JAVA_OPTS (read by the jenkins/jenkins entrypoint, which
            # appends it to the java args) rather than JAVA_OPTS — the latter can
            # also be picked up by other JVM tools invoked during builds.
            # mem_limit above is the hard memory ceiling regardless of JVM flags.
            #
            # Xmx320m вместо 512m: JVM забирает заявленный heap и держит его, даже
            # когда сборок нет. На машине с 961 МБ это была заявка на половину всей
            # оперативки. UseSerialGC — потому что ядро одно: параллельный сборщик
            # мусора здесь только тратит такты на координацию потоков, которых нет.
            # MaxMetaspaceSize ограничивает область под классы плагинов: у Jenkins
            # она растёт с каждым плагином и по умолчанию не ограничена вовсе.
            - JENKINS_JAVA_OPTS=-Xms128m -Xmx320m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m -Djenkins.install.runSetupWizard=true
        volumes:
            - jenkins_home:/var/jenkins_home
            - /var/run/docker.sock:/var/run/docker.sock
            # Controller-level GitHub status behaviour must also run before a Jenkinsfile is
            # available, so keep it versioned and mount it independently of the persistent home.
            - ./jenkins-image/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
            - /opt/apps:/opt/apps

volumes:
    jenkins_home:
